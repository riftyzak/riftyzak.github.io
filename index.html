<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webilio.cz</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(140deg, #f6f9fc 0%, #eef3ff 100%);
        color: #17233b;
      }

      main {
        width: min(680px, 100%);
        background: #fff;
        border: 1px solid #dce5f5;
        border-radius: 16px;
        padding: clamp(1.5rem, 3vw, 2.5rem);
        text-align: center;
        box-shadow: 0 20px 40px rgba(17, 27, 55, 0.08);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 5vw, 3rem);
        letter-spacing: -0.03em;
      }

      p {
        margin: 1rem 0 0;
        color: #3c4f72;
        line-height: 1.6;
        font-size: 1.05rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>webilio.cz</h1>
      <p>Moderní webové řešení na jednom místě.</p>
    </main>
  </body>
</html>
